<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="dashboard.html">
        <h1>Regsiter to Student Management System</h1>
        <div>
            Name:<input type="text" id="name" minlength="8" placeholder="Enter your name" required>
        </div>
        <div>
            Email:<input type="email" id="email" placeholder="Enter your email" >
        </div>
        <div>
            Password:<input type="password" id="password" minlength="8" placeholder="Enter your password" required>
        </div>
        <div>
            Confirm password:<input type="password" id="confpassword" minlength="8" placeholder="Enter your confirm password" required>
        </div>
        <div>
            <button type="submit">Register</button>
        </div>
        <div>
            <p>Already have an account?</p>
            <a href="login.html">Go to Login page</a>
        </div>
    </form>
</body>
</html>
